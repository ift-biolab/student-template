baseURL = 'https://ift-biolab.github.io/student-template/'
title = 'Student documentation'
locale = 'en'
defaultContentLanguage = 'en'
enableRobotsTXT = true

[module]
  [module.hugoVersion]
    min = '0.168.0'
  [[module.imports]]
    path = 'github.com/McShelby/hugo-theme-relearn'

[params]
  themeVariant = 'zen-light'
  # Future branding is documented in ADMIN.md; no custom branding in V1.
  [params.image]
    errorlevel = 'error'
  [params.link]
    errorlevel = 'error'
