name: Build and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.168.0'
  GO_VERSION: '1.27.2'
  # Relearn release 9.2.1 is locked to its module commit in go.mod and go.sum.
  TZ: Europe/Paris

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install pinned Hugo
        shell: bash
        run: |
          set -euo pipefail
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --location --retry 3 "$release/$archive" -o "$RUNNER_TEMP/$archive"
          curl --fail --location --retry 3 "$release/hugo_${HUGO_VERSION}_checksums.txt" -o "$RUNNER_TEMP/hugo-checksums.txt"
          cd "$RUNNER_TEMP"
          grep "  $archive\$" hugo-checksums.txt | sha256sum --check
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false # Administrator enables Pages manually before the first run.
      - name: Resolve pinned modules
        run: |
          hugo version
          go version
          hugo mod graph
          hugo mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Build
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify --panicOnWarning --baseURL "${PAGES_BASE_URL%/}/"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
